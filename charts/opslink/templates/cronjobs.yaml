{{- range .Values.jobs }}
{{- if .enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-%s" $.Release.Name .name | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $.Chart.Name }}
            app.kubernetes.io/instance: {{ $.Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: {{ .name }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              args: [{{ .command | quote }}]
              envFrom:
                - secretRef:
                    name: {{ $.Values.secretName }}
              resources:
                {{- toYaml $.Values.resources | nindent 16 }}
              {{- if and .needsGoogleCredentials $.Values.googleCredentials.enabled }}
              volumeMounts:
                - name: google-credentials
                  mountPath: {{ $.Values.googleCredentials.mountPath }}
                  subPath: {{ $.Values.googleCredentials.secretKey }}
                  readOnly: true
              {{- end }}
          {{- if and .needsGoogleCredentials $.Values.googleCredentials.enabled }}
          volumes:
            - name: google-credentials
              secret:
                secretName: {{ $.Values.secretName }}
                items:
                  - key: {{ $.Values.googleCredentials.secretKey }}
                    path: {{ $.Values.googleCredentials.secretKey }}
          {{- end }}
{{- end }}
{{- end }}
